<footer class="chrome:footer">
   <div class="chrome:footer_item">
      <span class="text-lg">Last commit: {{ get_last_commit() }}</span>
   </div>
   {% if has_pdf %}
   <div class="chrome:footer_item">
      <a class="text-lg" href="{{ pdf_url }}" download>Download as PDF</a>
   </div>
   {% endif %}
   <div class="chrome:footer_item">
      <span class="text-lg">Last update: {{ last_update() }}</span>
   </div>
</footer>
