<head about="{{ abspath }}">
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   {# Per-page title: this used to be hardcoded, so every page in the site shared
      one <title>, which broke browser tabs, bookmarks and search results. #}
   <title>{{ title }} — CATMuS guidelines</title>
   <meta name="description" content="{{ meta.description | default('Common rules for the transcription of documents from the Middle Ages to today.') | trim }}">
   <link rel="icon" href="/assets/images/favicon.ico" type="image/x-icon">
   <link rel="stylesheet" href="/assets/css/site.css"/>
</head>
