<header class="chrome:header">
   {# Drawer toggle, shown on narrow screens by site.css. #}
   <button type="button" class="nav-toggle" aria-controls="sidebar" aria-expanded="false">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
         <path fill="currentColor" d="M1 3h14v1.5H1zM1 7.25h14v1.5H1zM1 11.5h14V13H1z"></path>
      </svg>
      Contents
   </button>
   <a class="chrome:header_title" href="/index.html">
      <img class="site-logo" src="/assets/images/catmus.png" alt="">
      <span class="text-3xl">Consistent Approaches to Transcribing ManuScripts</span>
   </a>
   <div class="chrome:header_item">
      <form id="search" class="center">
         <label class="visually-hidden" for="search_input_guidelines">Search in the guidelines</label>
         <input type="text" id="search_input_guidelines" name="search_query" class="search_input" placeholder="Search in the guidelines" autocomplete="off">
         <button type="submit" id="search_button" aria-label="Search">
            <svg id="search_symbol" xmlns="http://www.w3.org/2000/svg" width="26" height="26" focusable="false" viewBox="0 0 26 26" aria-hidden="true">
               <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2">
                  <circle cx="11" cy="11" r="7"></circle>
                  <path d="M16 16l6 6"></path>
               </g>
            </svg>
         </button>
      </form>
   </div>
   <button type="button" class="theme-toggle" aria-label="Switch between light and dark">
      <span class="theme-toggle_light" aria-hidden="true">☀</span>
      <span class="theme-toggle_dark" aria-hidden="true">☾</span>
   </button>
   {# The repository URL used to be built from abspath.split('/')[-1], which
      produced an empty link on every local build. It now comes from meta.yml. #}
   <a class="repo-link" href="{{ repository }}" target="_blank" rel="noreferrer noopener" title="GitHub repository">
      <img src="/assets/images/github-mark.svg" alt="GitHub repository">
   </a>
</header>
